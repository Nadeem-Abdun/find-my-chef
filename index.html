<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF8F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1A1613" media="(prefers-color-scheme: dark)" />

    <title>Find My Chef — Connecting Chefs With Kitchens</title>
    <meta
      name="description"
      content="A dedicated platform connecting aspiring chefs with restaurants, hotels, cloud kitchens, cafes and food outlets."
    />

    <meta property="og:title" content="Find My Chef" />
    <meta
      property="og:description"
      content="Connecting aspiring chefs with their dream kitchens."
    />
    <meta property="og:type" content="website" />

    <script>
      // Single Page Apps for GitHub Pages: https://github.com/rafgraph/spa-github-pages
      // When redirected from 404.html, restore the URL so the SPA router takes over.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            '',
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
